<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anvil Office — Anvil Mobile Machining (Portfolio Demo)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,1 30,8.5 30,23.5 16,31 2,23.5 2,8.5' fill='%23ffcb05'/%3E%3Ctext x='16' y='22' font-family='Arial Black,Arial' font-size='16' font-weight='900' text-anchor='middle' fill='%2315171a'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ANVIL OFFICE — single-file app for a mobile heavy-equipment machining shop
   Steel + hi-vis industrial theme. Portfolio demo — "Anvil Mobile Machining" and
   all customers/jobs/transactions below are fictional synthetic data.
   Built by DataMind Consulting. Adapted from a real client deliverable; every
   name, contact, address, serial number, invoice number, and dollar figure has
   been replaced with invented demo data.
   ============================================================ */
:root{
  --steel-900:#15171a; --steel-850:#191c20; --steel-800:#1d2024; --steel-700:#2a2e34;
  --steel-600:#3a3f47; --steel-400:#6b7280; --steel-300:#9aa1ab;
  --paper:#f4f3ef; --hi-vis:#ffcb05; --hi-vis-dk:#e0ac00;
  --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.18);
  --ok:#58c98a; --bad:#ff7a5c; --warn:#ffb020;
  --disp:'Oswald','Bahnschrift SemiBold Condensed','Bahnschrift','Arial Narrow',sans-serif;
  --body:'Barlow','Segoe UI',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{font-family:var(--body);background:var(--steel-900);color:var(--paper);line-height:1.5;
  background-image:radial-gradient(1200px 500px at 80% -10%, rgba(255,203,5,.05), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.012) 3px 4px)}
h1,h2,h3,h4,.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.02em;line-height:1.08;font-weight:600}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:var(--body);font-size:1.02rem;color:var(--paper);
  background:var(--steel-900);border:1.5px solid var(--steel-600);border-radius:4px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--hi-vis);outline-offset:1px;border-color:var(--hi-vis)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--steel-300) 50%),linear-gradient(135deg,var(--steel-300) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-family:var(--disp);text-transform:uppercase;font-size:.78rem;letter-spacing:.14em;color:var(--steel-300);margin:0 0 6px}
::placeholder{color:var(--steel-400)}

.hazard{height:8px;width:100%;flex:none;
  background:repeating-linear-gradient(45deg,var(--hi-vis) 0 22px,var(--steel-900) 22px 44px)}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:14px 22px;background:var(--steel-850);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--disp);font-weight:700;font-size:1.12rem;
  text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.brand .mark{width:40px;height:40px;background:var(--hi-vis);color:var(--steel-900);flex:none;
  display:grid;place-items:center;font-weight:700;font-size:1.25rem;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:.6rem;letter-spacing:.26em;color:var(--hi-vis)}
.topbar .spacer{flex:1}
.top-owed{text-align:right;font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;color:var(--steel-300)}
.top-owed b{display:block;font-size:1.35rem;color:var(--hi-vis);letter-spacing:.02em}

/* ---------- nav tabs ---------- */
nav.tabs{display:flex;gap:2px;background:var(--steel-850);padding:0 14px;border-bottom:1px solid var(--line-strong);overflow-x:auto}
nav.tabs button{background:none;border:none;color:var(--steel-300);font-family:var(--disp);text-transform:uppercase;
  letter-spacing:.05em;font-size:1.02rem;font-weight:600;padding:16px 20px 13px;border-bottom:3px solid transparent;
  display:flex;align-items:center;gap:9px;white-space:nowrap;min-height:56px}
nav.tabs button svg{width:19px;height:19px;flex:none}
nav.tabs button:hover{color:var(--paper)}
nav.tabs button.on{color:var(--paper);border-bottom-color:var(--hi-vis)}
nav.tabs button .bdg{background:var(--bad);color:#fff;font-family:var(--body);font-weight:700;font-size:.72rem;
  min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}

main{max-width:1180px;margin:0 auto;padding:26px 22px 90px}

/* ---------- generic ---------- */
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--hi-vis);font-family:var(--disp);
  text-transform:uppercase;letter-spacing:.24em;font-size:.74rem}
.eyebrow::before{content:'';width:30px;height:2px;background:var(--hi-vis)}
.panel{background:var(--steel-800);border:1px solid var(--line);padding:22px;position:relative}
.panel.accent{border-top:3px solid var(--hi-vis)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.muted{color:var(--steel-300)}.small{font-size:.9rem}
.big-num{font-family:var(--disp);font-weight:700;font-size:2.1rem;letter-spacing:.01em;line-height:1}
.pos{color:var(--ok)}.neg{color:var(--bad)}.hv{color:var(--hi-vis)}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

.btn{background:var(--hi-vis);color:var(--steel-900);border:none;padding:14px 22px;font-family:var(--disp);
  text-transform:uppercase;font-weight:700;letter-spacing:.05em;font-size:1rem;display:inline-flex;align-items:center;gap:10px;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:.15s;min-height:48px}
.btn:hover{background:#fff}
.btn.ghost{background:transparent;color:var(--paper);border:1.5px solid var(--steel-600);clip-path:none}
.btn.ghost:hover{border-color:var(--hi-vis);color:var(--hi-vis);background:transparent}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad);clip-path:none}
.btn.danger:hover{background:var(--bad);color:#fff}
.btn.sm{padding:8px 14px;font-size:.86rem;min-height:38px}
.btn svg{width:18px;height:18px}
.iconbtn{background:none;border:none;color:var(--steel-300);padding:8px;border-radius:4px;display:inline-grid;place-items:center}
.iconbtn:hover{color:var(--paper);background:var(--steel-700)}
.iconbtn.del:hover{color:var(--bad)}
.iconbtn svg{width:18px;height:18px}

/* ---------- chips / status ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);text-transform:uppercase;
  font-size:.72rem;letter-spacing:.1em;font-weight:600;padding:4px 10px;border:1px solid var(--steel-600);color:var(--steel-300);white-space:nowrap}
.chip.estimate{color:var(--steel-300)}
.chip.progress{color:#7db8ff;border-color:#33507a}
.chip.invoiced{color:var(--hi-vis);border-color:var(--hi-vis-dk)}
.chip.paid{color:var(--ok);border-color:#2a6b48}
.chip.overdue{color:#fff;background:var(--bad);border-color:var(--bad)}
.chip.cat{font-family:var(--body);letter-spacing:.03em;font-weight:600;text-transform:none;font-size:.8rem}
.chip.personal{color:#d8a0ff;border-color:#7a4d9e}

/* ---------- tables ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:1rem}
.tbl th{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:.74rem;color:var(--steel-300);
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-strong)}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--steel-700)}
.tbl .r{text-align:right}
.tbl td.money{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.plate{display:inline-block;background:var(--hi-vis);color:var(--steel-900);font-family:var(--disp);font-weight:700;
  padding:3px 9px;letter-spacing:.04em;font-size:.95rem;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}

/* ---------- customer cards ---------- */
.cust-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.cust{background:var(--steel-800);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:10px;
  border-left:3px solid var(--hi-vis)}
.cust h3{font-size:1.3rem}
.cust .contactline{display:flex;gap:10px;align-items:center;font-size:1.02rem}
.cust .contactline svg{width:17px;height:17px;color:var(--hi-vis);flex:none}
.cust .machines{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.mach{display:flex;gap:8px;align-items:baseline;font-size:.92rem;color:var(--steel-300);border:1px dashed var(--steel-600);padding:6px 10px}
.mach b{color:var(--paper);font-weight:600}
.cust .foot{display:flex;gap:10px;margin-top:auto;padding-top:10px}

/* ---------- dashboard ---------- */
.statcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.stat{background:var(--steel-800);border:1px solid var(--line);padding:18px 20px 16px;border-top:3px solid var(--steel-600)}
.stat.y{border-top-color:var(--hi-vis)}.stat.g{border-top-color:var(--ok)}.stat.r{border-top-color:var(--bad)}
.stat .lbl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--steel-300);margin-bottom:8px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.quick button{background:var(--steel-800);border:1px solid var(--steel-600);color:var(--paper);padding:20px 16px;
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-weight:600;font-size:1.04rem;
  display:flex;flex-direction:column;align-items:center;gap:10px;transition:.15s;min-height:96px}
.quick button svg{width:28px;height:28px;color:var(--hi-vis)}
.quick button:hover{border-color:var(--hi-vis);background:var(--steel-700);transform:translateY(-2px)}
.owedlist .tbl td{padding:11px 12px}
.bars{display:flex;gap:14px;align-items:flex-end;height:120px;padding-top:8px}
.bargrp{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bargrp .pair{display:flex;gap:4px;align-items:flex-end;height:92px}
.bargrp .b{width:16px;background:var(--ok)}
.bargrp .b.out{background:var(--bad)}
.bargrp .m{font-size:.72rem;color:var(--steel-300);font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em}
.banner{background:var(--steel-800);border:1px solid var(--hi-vis-dk);border-left:6px solid var(--hi-vis);padding:14px 18px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner b{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em}

/* ---------- modal ---------- */
#modal-root{position:fixed;inset:0;display:none;z-index:100}
#modal-root.open{display:block}
.modal-back{position:absolute;inset:0;background:rgba(10,11,13,.78);backdrop-filter:blur(3px)}
.modal{position:relative;max-width:860px;margin:4vh auto;background:var(--steel-800);border:1px solid var(--line-strong);
  max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.narrow{max-width:560px}
.modal>.hazard{height:6px}
.modal .mhead{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--line)}
.modal .mhead h2{font-size:1.4rem}
.modal .mbody{padding:22px 24px;overflow-y:auto}
.modal .mfoot{display:flex;gap:12px;padding:16px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.frow{margin-bottom:14px}
.linerow{display:grid;grid-template-columns:150px 1fr 84px 84px 110px 40px;gap:8px;align-items:center;margin-bottom:8px}
.taskrow{display:grid;grid-template-columns:44px 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.taskrow .tno{font-family:var(--disp);color:var(--hi-vis);font-weight:600;text-align:center}
.machrow{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:8px;margin-bottom:8px}
.totline{display:flex;justify-content:flex-end;gap:26px;font-size:1.05rem;padding:4px 48px 4px 0}
.totline b{min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
.totline.grand{font-family:var(--disp);text-transform:uppercase;font-size:1.2rem;color:var(--hi-vis)}

/* ---------- import preview ---------- */
.imp-row-off td{opacity:.38}
.imp-reason{font-size:.78rem;color:var(--warn)}
.dupe{color:var(--steel-400);font-size:.78rem}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--hi-vis);color:var(--steel-900);
  font-family:var(--disp);text-transform:uppercase;font-weight:700;letter-spacing:.05em;padding:13px 26px;opacity:0;
  pointer-events:none;transition:.25s;z-index:200;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{text-align:center;padding:60px 20px;color:var(--steel-300)}
.empty svg{width:54px;height:54px;color:var(--steel-600);margin-bottom:14px}
.empty h3{color:var(--paper);margin-bottom:8px;font-size:1.3rem}

/* ---------- print document ---------- */
#print-root{display:none}
@media print{
  body{background:#fff}
  .app-chrome, .hazard.top, #toast, #modal-root{display:none !important}
  #print-root{display:block}
  @page{margin:14mm 14mm 16mm}
}
.inv{font-family:var(--body);color:#191c20;background:#fff;font-size:10.6pt;line-height:1.45}
.inv .inv-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4mm}
.inv h1{font-family:var(--disp);font-size:26pt;letter-spacing:.04em;color:#15171a}
.inv h1::after{content:'';display:block;width:34mm;height:2.2mm;background:var(--hi-vis);margin-top:1.4mm}
.inv .meta{text-align:right;font-size:10.5pt}
.inv .meta b{display:inline-block;min-width:24mm;text-align:left;font-family:var(--disp);text-transform:uppercase;font-size:8.6pt;letter-spacing:.08em;color:#555}
.inv .parties{display:flex;justify-content:space-between;gap:10mm;margin:5mm 0 6mm}
.inv .party{font-size:10.4pt}
.inv .party .pname{font-family:var(--disp);font-weight:600;font-size:12pt;text-transform:uppercase}
.inv .party .plabel{font-family:var(--disp);text-transform:uppercase;font-size:8.4pt;letter-spacing:.14em;color:#777;margin-bottom:1.6mm}
.inv .sechead{font-family:var(--disp);text-transform:uppercase;font-size:10pt;letter-spacing:.1em;background:#15171a;color:#fff;
  padding:1.8mm 3mm;margin:5mm 0 2.4mm;display:flex;align-items:center;gap:3mm}
.inv .sechead::before{content:'';width:3.2mm;height:3.2mm;background:var(--hi-vis)}
.inv p.desc{margin:1mm 0;white-space:pre-line}
.inv table{width:100%;border-collapse:collapse;font-size:10.2pt}
.inv th{font-family:var(--disp);text-transform:uppercase;font-size:8.4pt;letter-spacing:.1em;color:#555;text-align:left;
  border-bottom:1.6px solid #15171a;padding:1.6mm 2mm}
.inv td{padding:1.9mm 2mm;border-bottom:.5px solid #ccc;vertical-align:top}
.inv td.r,.inv th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.inv .tasknum{font-family:var(--disp);color:#111;font-weight:600}
.inv .totals{margin-top:3mm;margin-left:auto;width:62mm}
.inv .totals .trow{display:flex;justify-content:space-between;padding:1.2mm 2mm;font-size:10.6pt}
.inv .totals .trow.grand{font-family:var(--disp);text-transform:uppercase;font-weight:700;font-size:12.5pt;
  border-top:2px solid #15171a;background:var(--hi-vis);margin-top:1mm}
.inv .terms{margin-top:6mm;font-size:9.6pt}
.inv .terms ol{margin:1.6mm 0 0 5mm}
.inv .terms li{margin-bottom:1mm}
.inv .inv-foot{margin-top:8mm;text-align:center;font-family:var(--disp);text-transform:uppercase;letter-spacing:.18em;font-size:8.6pt;color:#666}
.inv .footstripe{height:2.6mm;margin-top:2mm;background:repeating-linear-gradient(45deg,var(--hi-vis) 0 5mm,#15171a 5mm 10mm)}

@media (max-width:760px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .linerow{grid-template-columns:110px 1fr 64px 64px 88px 34px;font-size:.9rem}
  main{padding:18px 12px 80px}
  .topbar{padding:12px 14px}
  .modal{margin:0;max-height:100vh;height:100%}
}
</style>
</head>
<body>
<div class="app-chrome">
  <div class="hazard top"></div>
  <header class="topbar">
    <div class="brand">
      <div class="mark">A</div>
      <div>Anvil Mobile Machining<small>Anvil Office · Demo</small></div>
    </div>
    <div class="spacer"></div>
    <div class="top-owed">Owed to you<b id="top-owed">$0</b></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-v="home" onclick="A.show('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home</button>
    <button data-v="customers" onclick="A.show('customers')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.4 3.4-5 6.5-5s5.7 1.6 6.5 5"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M16 15.2c2.6.2 4.6 1.6 5.3 4.3"/></svg>
      Customers</button>
    <button data-v="jobs" onclick="A.show('jobs')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h10l2 4v14H5V7z"/><path d="M7 3v4h10V3"/><path d="M9 12h6M9 16h6"/></svg>
      Jobs &amp; Invoices <span class="bdg" id="badge-overdue" style="display:none"></span></button>
    <button data-v="money" onclick="A.show('money')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="1.5"/><circle cx="12" cy="12.5" r="3"/><path d="M2 10h3M19 15h3"/></svg>
      Money</button>
    <button data-v="settings" onclick="A.show('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M19.1 4.9l-2.2 2.2M7.1 16.9l-2.2 2.2"/></svg>
      Settings</button>
  </nav>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast"></div>
<div id="print-root"></div>
<input type="file" id="file-csv" accept=".csv,text/csv" style="display:none">
<input type="file" id="file-restore" accept=".json,application/json" style="display:none">
<script>
'use strict';
/* ================= ANVIL OFFICE — core ================= */
const KEY = 'anvil-office-v1';
const CATS = ['Parts & Materials','Welding Gas & Supplies','Consumables','Tools & Equipment','Shop Supplies',
  'Fuel','Vehicle & Travel','Shipping & Postage','Software & Office','Insurance','Loan & Lease Payments',
  'Bank & Card Fees','Meals','Advertising','Subcontractors','Other','Personal'];
const LINE_ITEMS = ['Labor','Travel','Parts','Materials','Hardware','Consumables','Other'];
const STATUSES = { estimate:'Estimate', progress:'In progress', invoiced:'Invoiced', paid:'Paid' };

const SEED = {
  settings:{
    business:{ name:'Anvil Mobile Machining', addr1:'PO Box 123', addr2:'Anytown, ST 00000',
      phone:'555-555-0142', email:'dispatch@anvil.example' },
    defaultRate:175, defaultTermsDays:15, lastBackup:null, welcomed:false
  },
  customers:[
    { id:'c1', seed:true, company:'Meridian Concrete & Construction', contact:'Dana Ruiz', phone:'555-555-0114',
      email:'dana@meridian.example', address:'4410 Quarry Ridge Rd\nSpringfield, ST 00000', termsDays:15, notes:'',
      machines:[{make:'Acme', model:'EX-220', serial:'DEMO-10021'}] },

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmt$(n){ const v=Number(n)||0; const s='$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return v<0?'-'+s:s; }
function fmt$0(n){ const v=Number(n)||0; return '$'+Math.round(v).toLocaleString('en-US'); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number); return m+'/'+d+'/'+y; }
function monthKey(iso){ return iso ? iso.slice(0,7) : ''; }
function monthName(key){ const [y,m]=key.split('-').map(Number); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]+' '+y; }
function daysSince(iso){ const [y,m,d]=iso.split('-').map(Number); return Math.floor((Date.now()-new Date(y,m-1,d).getTime())/86400000); }
function cust(id){ return S.customers.find(c=>c.id===id); }
function job(id){ return S.jobs.find(j=>j.id===id); }
function jobTotal(j){ return (j.lines||[]).reduce((t,l)=>t+(Number(l.amount)||0),0); }
function jobLabor(j){ return (j.lines||[]).filter(l=>l.item==='Labor').reduce((t,l)=>t+(Number(l.amount)||0),0); }
function jobPaid(j){ return (j.payments||[]).reduce((t,p)=>t+(Number(p.amount)||0),0); }
function jobBalance(j){ return jobTotal(j)-jobPaid(j); }
function isOverdue(j){ return j.status==='invoiced' && daysSince(j.date) > (j.termsDays||S.settings.defaultTermsDays); }
function suggestInvoiceNo(dateIso){
  const d = dateIso || today();
  const yymm = d.slice(2,4)+d.slice(5,7);
  let max = 0;
  S.jobs.forEach(j=>{ const m=(j.invoiceNo||'').match(/^(\d{4})\.(\d+)$/); if(m && m[1]===yymm) max=Math.max(max,Number(m[2])); });
  return yymm+'.'+String(max+1).padStart(2,'0');
}
function applyRules(desc){
  const u = (desc||'').toUpperCase();
  for(const r of S.rules){ if(r.match && u.includes(r.match.toUpperCase())) return r.category; }
  return '';
}
/* income for a month across payments + income records */
function incomeEntries(){
  const out = [];
  S.money.forEach(m=>{ if(m.kind==='income') out.push({date:m.date, amount:m.amount, who:m.vendor, desc:m.desc, moneyId:m.id}); });
  S.jobs.forEach(j=>(j.payments||[]).forEach(p=>{
    out.push({date:p.date, amount:p.amount, who:(cust(j.customerId)||{}).company||'', desc:'Payment on invoice '+j.invoiceNo+(p.method?' ('+p.method+')':''), jobId:j.id});
  }));
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2600);
}
function download(name, text, mime){
  const blob = new Blob([text], {type: mime||'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
/* CSV parser: handles quotes, embedded commas, doubled quotes */
function parseCSV(text){
  const rows=[]; let row=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
      else field+=ch;
    }else{
      if(ch==='"') inQ=true;
      else if(ch===','){ row.push(field); field=''; }
      else if(ch==='\n'||ch==='\r'){
        if(ch==='\r'&&text[i+1]==='\n') i++;
        row.push(field); field='';
        if(row.length>1||row[0]!=='') rows.push(row);
        row=[];
      }
      else field+=ch;
    }
  }
  if(field!==''||row.length){ row.push(field); if(row.length>1||row[0]!=='') rows.push(row); }
  return rows;
}
function usDateToIso(s){
  const m = (s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
}
function moneyHash(date, amount, desc){ return date+'|'+Number(amount)+'|'+String(desc||'').slice(0,24); }

          <td>${m.personal?`<span class="chip personal">Personal</span>`:`<span class="chip cat">${esc(m.category||'—')}</span>`}</td>
          <td class="r money ${m.amount<0?'pos':''}">${fmt$(m.amount)}</td>
          <td class="r"><button class="iconbtn del" title="Delete" onclick="A.delMoney('${m.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2m-8 0l1 13h8l1-13"/></svg></button></td></tr>`;
      });
      h += `</tbody></table></div>`;
    }
  }else if(A.moneyTab==='in'){
    if(!inc.length) h += `<div class="empty"><h3>No payments yet</h3><p>Record payments on invoices, or import your bank CSV.</p></div>`;
    else{

        <div style="width:210px;flex:none">${esc(c)}</div>

    });

  }

/* ---------- backup / restore ---------- */
A.backup = function(){
  S.settings.lastBackup = today(); save();
  download('Anvil-Backup-'+today()+'.json', JSON.stringify(S, null, 1), 'application/json');
  toast('Backup file downloaded'); render();
};
function restoreFile(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const data = JSON.parse(rd.result);
      if(!data.settings || !Array.isArray(data.jobs)) throw new Error('not an Anvil Office backup');
      if(!confirm('Replace everything with this backup from '+(data.settings.lastBackup||'unknown date')+'?')) return;
      S = data; save(); render(); toast('Backup restored');
    }catch(e){ alert('That file is not a valid Anvil Office backup.'); }
  };
  rd.readAsText(file);
}

          <option value="30" ${j.termsDays===30?'selected':''}>30 days</option></select></div>
      </div>
      <div class="frow" style="margin-top:14px"><label>Customer description of the problem</label>
        <textarea id="jf-problem" placeholder="Customer states ...">${esc(j.problem)}</textarea>${machChips}</div>
      <div class="frow"><label>Where the work happens</label>
        <input id="jf-location" placeholder="Work performed at ..." value="${esc(j.location)}"></div>

      <div id="jf-tasks">` +
      j.tasks.map((t,i)=>`<div class="taskrow"><div class="tno">${String(i+1).padStart(2,'0')}</div>
        <input value="${esc(t)}" data-task="${i}" placeholder="Anvil ...">
        <button class="iconbtn del" onclick="A.rmTask(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2m-8 0l1 13h8l1-13"/></svg></button></div>`).join('') +
      `</div>
      <button class="btn sm ghost" onclick="A.addTask()" style="margin-bottom:18px">+ Add work line</button>

      <label>Billing</label>
      <div class="linerow" style="margin-bottom:2px">

        <button class="iconbtn del" onclick="A.rmLine(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2m-8 0l1 13h8l1-13"/></svg></button>

        <div class="totline grand">Total <b id="jt-total">$0.00</b></div>
      </div>` +
      (j.id && j.payments && j.payments.length ?

}
function syncJobDraft(){
  const j = A.draftJ;
  j.customerId=$('#jf-cust').value; j.date=$('#jf-date').value||today();
  j.invoiceNo=$('#jf-no').value.trim(); j.po=$('#jf-po').value.trim();
  j.status=$('#jf-status').value; j.termsDays=Number($('#jf-terms').value)||15;
  j.problem=$('#jf-problem').value; j.location=$('#jf-location').value;
  j.tasks = $$('#jf-tasks input').map(i=>i.value);
  $$('#jf-lines [data-lf]').forEach(el=>{
    const l = j.lines[Number(el.dataset.i)]; const f = el.dataset.lf;
    if(f==='item'||f==='desc') l[f]=el.value;
    else l[f] = el.value===''?null:Number(el.value);
  });
}
A.jobCustChanged = function(){
  syncJobDraft();
  const c = cust(A.draftJ.customerId);
  if(c && c.termsDays) A.draftJ.termsDays = c.termsDays;
  renderJobModal();
};
A.insMachine = function(i){
  syncJobDraft();
  const c = cust(A.draftJ.customerId); if(!c) return;
  const m = c.machines[i];
  const txt = m.make+' '+m.model+' s/n '+m.serial;
  A.draftJ.problem = (A.draftJ.problem?A.draftJ.problem+' ':'Customer states ') + txt + ' ';
  renderJobModal();
};
A.addTask = function(){ syncJobDraft(); A.draftJ.tasks.push(''); renderJobModal(); };
A.rmTask = function(i){ syncJobDraft(); A.draftJ.tasks.splice(i,1); renderJobModal(); };
A.addLine = function(){ syncJobDraft(); A.draftJ.lines.push({item:'Labor',desc:'',hours:null,rate:S.settings.defaultRate,amount:0}); renderJobModal(); };
A.rmLine = function(i){ syncJobDraft(); A.draftJ.lines.splice(i,1); renderJobModal(); };
A.lineCalc = function(i){
  const h = $(`#jf-lines [data-lf="hours"][data-i="${i}"]`).value;
  const r = $(`#jf-lines [data-lf="rate"][data-i="${i}"]`).value;
  if(h!=='' && r!==''){ $(`#jf-lines [data-lf="amount"][data-i="${i}"]`).value = (Number(h)*Number(r)).toFixed(2); }
  A.lineTotals();
};
A.lineTotals = function(){
  let labor=0, non=0;
  $$('#jf-lines .linerow').forEach(row=>{
    const item = row.querySelector('[data-lf="item"]').value;
    const amt = Number(row.querySelector('[data-lf="amount"]').value)||0;
    if(item==='Labor') labor+=amt; else non+=amt;
  });
  $('#jt-labor').textContent = fmt$(labor);
  $('#jt-nonlabor').textContent = fmt$(non);
  $('#jt-total').textContent = fmt$(labor+non);
};
A.saveJob = function(print){
  syncJobDraft();
  const j = A.draftJ;
  if(!j.customerId){ alert('Pick a customer first.'); return; }
  if(!j.invoiceNo) j.invoiceNo = suggestInvoiceNo(j.date);
  j.tasks = j.tasks.filter(t=>t.trim());
  j.lines = j.lines.filter(l=>l.desc || l.amount);
  j.lines.forEach(l=>{ if(l.hours!=null && l.rate!=null && (l.amount==null||l.amount===0)) l.amount=l.hours*l.rate; });
  if(j.id){ const i = S.jobs.findIndex(x=>x.id===j.id); S.jobs[i]=j; }
  else{ j.id = uid(); S.jobs.push(j); }
  save(); closeModal(); render(); toast(j.status==='estimate'?'Estimate saved':'Invoice saved');
  if(print) A.printJob(j.id);
};
A.openJob = function(id){ A.editJob(id); };
A.delJob = function(id){
  if(!confirm('Delete this job/invoice entirely?')) return;
  S.jobs = S.jobs.filter(j=>j.id!==id);
  save(); closeModal(); render(); toast('Job deleted');
};
A.rmPayment = function(i){
  syncJobDraft();
  A.draftJ.payments.splice(i,1);
  if(A.draftJ.status==='paid') A.draftJ.status='invoiced';
  renderJobModal();
};

  syncJobDraft();

  const bal = jobBalance(j);
  openModal(`
    <div class="mhead"><h2>Record payment — ${esc(j.invoiceNo)}</h2></div>
    <div class="mbody">
      <p class="muted" style="margin-bottom:14px">Balance owed: <b class="hv">${fmt$(bal)}</b></p>
      <div class="fgrid">
        <div><label>Date received</label><input id="pf-date" type="date" value="${today()}"></div>
        <div><label>Amount</label><input id="pf-amount" type="number" step="0.01" value="${bal>0?bal.toFixed(2):''}"></div>
        <div><label>How</label><select id="pf-method"><option>Check</option><option>ACH</option><option>Cash</option><option>Card</option><option>Other</option></select></div>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn" onclick="A.savePayment('${id}')">Save Payment</button>
      <button class="btn ghost" onclick="renderJobModal()">Back</button>

};
A.savePayment = function(id){
  const amt = Number($('#pf-amount').value);
  if(!amt){ alert('Enter the amount received.'); return; }
  const j = A.draftJ;
  j.payments = j.payments||[];
  j.payments.push({date:$('#pf-date').value||today(), amount:amt, method:$('#pf-method').value});

  const i = S.jobs.findIndex(x=>x.id===j.id);
  if(i>=0) S.jobs[i]=j;

/* ================= CSV import ================= */
A.startImport = function(){ $('#file-csv').value=''; $('#file-csv').click(); };
function classifyBankRow(desc, debit, credit){
  const u = desc.toUpperCase();
  if(credit>0){
    if(u.includes('CONTINENTAL FLEET')) return {kind:'income', include:true, vendor:'Continental Fleet Services', note:'EDI payment'};
    if(u.includes('DEPOSIT')) return {kind:'income', include:true, vendor:'Deposit', note:desc};
    return {kind:'income', include:true, vendor:desc, note:''};
  }
  const transfers = ['CREDIT CARD PMT',' TO:','MOBILE CHECK','TRANSFER TO SAVINGS','RETIREMENT CONTRIB','MORTGAGE PMT','TAXES','CASH ','AUTO LOAN PMT','INSURANCES'];
  if(transfers.some(t=>u.includes(t))) return {kind:'expense', include:false, vendor:desc, note:'transfer / personal — skipped'};
  return {kind:'expense', include:true, vendor:desc, note:''};
}
function buildImportRows(rows){
  const head = rows[0].map(h=>h.trim().toLowerCase());
  const out = [];
  if(head.includes('post date') && head.includes('debit')){
    // Bank AccountHistory format
    const ix = {date:head.indexOf('post date'), desc:head.indexOf('description'), debit:head.indexOf('debit'), credit:head.indexOf('credit')};
    rows.slice(1).forEach(r=>{
      const date = usDateToIso(r[ix.date]); if(!date) return;
      const debit = Number(r[ix.debit])||0, credit = Number(r[ix.credit])||0;
      const desc = (r[ix.desc]||'').trim();
      const cls = classifyBankRow(desc, debit, credit);
      const amount = cls.kind==='income' ? credit : debit;
      if(!amount) return;
      out.push({ date, desc, amount, kind:cls.kind, include:cls.include, reason:cls.note,
        vendor:cls.kind==='income'?cls.vendor:desc, category:applyRules(desc)||'Other', source:'bank-csv' });
    });
    return {fmt:'Bank account history', rows:out};
  }
  if(head.includes('transaction') && head.includes('memo')){
    // Credit card format
    const ix = {date:head.indexOf('date'), tx:head.indexOf('transaction'), name:head.indexOf('name'), memo:head.indexOf('memo'), amt:head.indexOf('amount')};
    rows.slice(1).forEach(r=>{
      const date = (r[ix.date]||'').trim(); if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      const raw = Number(r[ix.amt])||0;
      const name = (r[ix.name]||'').trim().replace(/\s+/g,' ');
      if(r[ix.tx]==='CREDIT'){
        if(name.toUpperCase().includes('PAYMENT'))
          out.push({date, desc:name, amount:raw, kind:'expense', include:false, reason:'card payment — skipped', vendor:name, category:'Other', source:'cc-csv'});
        else
          out.push({date, desc:name+' (refund)', amount:-Math.abs(raw), kind:'expense', include:true, reason:'refund', vendor:name, category:applyRules(name)||'Other', source:'cc-csv'});
        return;
      }
      const cat = applyRules(name)||'Other';
      out.push({ date, desc:name, amount:Math.abs(raw), kind:'expense', include:true, reason:'',
        vendor:name, category:cat, source:'cc-csv' });
    });
    return {fmt:'Credit card statement', rows:out};
  }
  return null;
}
function importFile(file){
  const rd = new FileReader();
  rd.onload = () => {
    const parsed = parseCSV(String(rd.result));
    if(!parsed.length){ alert('Could not read that file.'); return; }
    const built = buildImportRows(parsed);
    if(!built){ alert('That does not look like your bank or credit-card CSV.\nExpected the account history or card statement download.'); return; }
    built.rows.forEach(r=>{
      r.hash = moneyHash(r.date, r.amount, r.desc);
      r.dupe = S.money.some(m=>m.hash===r.hash ||
        (m.date===r.date && m.kind===r.kind && Math.abs(Number(m.amount)-Number(r.amount))<0.005));
      if(r.dupe) r.include = false;
      if(r.kind==='income' && !r.reason && !r.dupe) r.reason = 'skip this if you already recorded it on an invoice';
      if(r.category==='Personal'){ r.personal = true; } else r.personal = false;
    });
    A.imp = built;
    renderImportModal();
  };
  rd.readAsText(file);
}
function renderImportModal(){
  const {fmt, rows} = A.imp;
  const nSel = rows.filter(r=>r.include).length;
  openModal(`
    <div class="mhead"><h2>Import — ${esc(fmt)}</h2></div>
    <div class="mbody">
      <p class="muted small" style="margin-bottom:12px">Check what to bring in. Transfers, card payments and things you already imported are unchecked automatically.</p>
      <table class="tbl"><thead><tr><th></th><th>Date</th><th>What</th><th>Category</th><th class="r">Amount</th></tr></thead><tbody>` +
      rows.map((r,i)=>`<tr class="${r.include?'':'imp-row-off'}">
        <td><input type="checkbox" style="width:20px;height:20px" ${r.include?'checked':''} onchange="A.imp.rows[${i}].include=this.checked;renderImportModal()"></td>
        <td style="white-space:nowrap">${fmtDate(r.date)}</td>
        <td>${esc(r.desc.slice(0,46))}${r.reason?`<div class="imp-reason">${esc(r.reason)}</div>`:''}${r.dupe?`<div class="dupe">already imported</div>`:''}</td>
        <td>${r.kind==='income'?'<span class="chip cat">Money in</span>':
          `<select style="padding:6px 30px 6px 8px;font-size:.86rem" onchange="A.imp.rows[${i}].category=this.value">` +
          CATS.map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('') + `</select>`}</td>
        <td class="r money ${r.kind==='income'?'pos':''}">${fmt$(r.amount)}</td></tr>`).join('') +
      `</tbody></table>
    </div>
    <div class="mfoot">
      <button class="btn" onclick="A.commitImport()">Import ${nSel} item${nSel===1?'':'s'}</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
    </div>`);
}
A.commitImport = function(){
  let n=0;
  A.imp.rows.forEach(r=>{
    if(!r.include) return;
    S.money.push({ id:uid(), date:r.date, kind:r.kind, vendor:r.vendor, desc:r.kind==='income'?r.desc:'',
      amount:r.amount, category:r.kind==='income'?'':r.category,
      personal:r.category==='Personal', jobId:null, source:r.source, hash:r.hash });
    n++;
  });
  save(); closeModal(); A.moneyTab='out'; if(A.view!=='money') A.show('money'); else render();
  toast(n+' item'+(n===1?'':'s')+' imported');
};

/* ================= tax export ================= */
A.taxExport = function(){
  const yr = today().slice(0,4);
  const esc2 = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  let csv = 'Type,Date,Vendor/Customer,Description,Category,Amount\n';
  incomeEntries().filter(e=>e.date.startsWith(yr)).slice().reverse().forEach(e=>{
    csv += ['Income', e.date, esc2(e.who), esc2(e.desc), '', e.amount.toFixed(2)].join(',')+'\n'; });
  S.money.filter(m=>m.kind==='expense' && !m.personal && m.date.startsWith(yr))
    .sort((a,b)=>a.date.localeCompare(b.date)).forEach(m=>{
      csv += ['Expense', m.date, esc2(m.vendor), esc2(m.desc), esc2(m.category), (-m.amount).toFixed(2)].join(',')+'\n'; });
  download('Anvil-Tax-Export-'+yr+'.csv', csv, 'text/csv');
  toast('Tax export downloaded');
};

document.addEventListener('DOMContentLoaded', () => {
  load();
  $('#file-csv').addEventListener('change', e=>{ if(e.target.files[0]) importFile(e.target.files[0]); });
  $('#file-restore').addEventListener('change', e=>{ if(e.target.files[0]) restoreFile(e.target.files[0]); e.target.value=''; });
  A.show('home');
});
